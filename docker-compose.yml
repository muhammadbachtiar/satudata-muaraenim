# Satu Data Muara Enim - app + queue worker + scheduler.
# Redis and the database are NOT started here: the existing Redis on the host
# is used (see .env.docker.example and docs/docker-deployment.md).
#
#   cp .env.docker.example .env.docker   # then edit it
#   docker compose up -d --build

name: satudata

x-satudata: &satudata
  image: satudata:latest
  env_file: .env.docker
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ${STORAGE_PATH:-/var/www/satudata/storage}:/var/www/html/storage
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # Web: nginx + php-fpm. Builds the image once.
  app:
    <<: *satudata
    container_name: satudata_app
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    environment:
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Worker: reuses the image built by app
  worker:
    <<: *satudata
    container_name: satudata_worker
    depends_on:
      app:
        condition: service_started
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--timeout=600", "--max-time=3600", "--max-jobs=500"]
    stop_grace_period: 60s

  # Scheduler: reuses the image built by app
  scheduler:
    <<: *satudata
    container_name: satudata_scheduler
    depends_on:
      app:
        condition: service_started
    command: ["php", "artisan", "schedule:work"]

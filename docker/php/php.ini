; Production PHP settings for the satudata container.
expose_php = 0
memory_limit = 256M

; Admin PDF uploads (validation allows up to 500000 KB).
upload_max_filesize = 512M
post_max_size = 520M
max_input_time = 300

; Web requests should never run long; slow external APIs are handled by the
; background worker, and cURL calls already time out after 15 s.
max_execution_time = 60

realpath_cache_size = 4096K
realpath_cache_ttl = 600

; The code is baked into the image and never changes at runtime, so opcache
; does not need to stat files on every request.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

; Overrides the default [www] pool of the official php-fpm image.
; FPM_* values are environment variables with defaults set in the Dockerfile.
[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

; Keep the container environment (env_file) visible to Laravel.
clear_env = no

pm = dynamic
pm.max_children = ${FPM_MAX_CHILDREN}
pm.start_servers = ${FPM_START_SERVERS}
pm.min_spare_servers = ${FPM_MIN_SPARE}
pm.max_spare_servers = ${FPM_MAX_SPARE}
pm.max_requests = 500

; A hung request must not pin a worker forever.
request_terminate_timeout = 120s

; Log a PHP stack trace to `docker compose logs app` for any request slower than
; 10 s. This shows exactly which call (cURL, DB, ...) is the slow one.
request_slowlog_timeout = 10s
slowlog = /proc/self/fd/2

catch_workers_output = yes
decorate_workers_output = no

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30;

    # Admin uploads PDFs up to ~488 MB (PDF rule `max:500000` KB).
    # The nginx on the HOST must allow the same size, see docs/docker-deployment.md.
    client_max_body_size 520m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Behind the host nginx: restore the real visitor IP from X-Forwarded-For so
    # TrackVisitor (unique IP per day) does not count every visitor as one IP.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # TLS is terminated on the host; tell Laravel the original request was https.
    map $http_x_forwarded_proto $forwarded_https {
        default off;
        https   on;
    }

    server {
        listen 8080 default_server;
        server_name _;

        root /var/www/html/public;
        index index.php;
        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # public/storage is a symlink to storage/app/public (uploaded files).
        location /storage/ {
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        location ~ ^/index\.php(/|$) {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param HTTPS $forwarded_https;
            fastcgi_read_timeout 120s;
            fastcgi_buffer_size 16k;
            fastcgi_buffers 16 16k;
        }

        # Never execute any other .php file (e.g. something uploaded to storage).
        location ~ \.php$ {
            return 404;
        }

        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}
